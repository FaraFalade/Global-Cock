<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2D6A4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WAT Clock">
<title>WAT Clock</title>
<style>
:root{--green:#2D6A4F;--lime:#74C69D;--cream:#F8F4E3;--bg:#f0f4f1;--card:#fff;--text:#1a2e1f;--muted:#6b7c6f;--border:#d4e4d9;}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a12;--card:#1a2e1f;--text:#e2f0e6;--muted:#7daa8a;--border:#2a4232;}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto}
.hdr{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 12px;text-align:center;flex-shrink:0}
.hdr-label{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.hdr-time{font-size:30px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1}
.hdr-time .ap{font-size:14px;font-weight:700;letter-spacing:1px;opacity:.9;margin-left:4px;vertical-align:middle}
.hdr-date{font-size:11px;opacity:.82;margin-top:3px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.panel{display:none;padding:14px;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px) + 10px)}
.panel.on{display:block}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:10px;-webkit-tap-highlight-color:transparent;transition:color .15s}
.tab.on{color:var(--green);font-weight:700}
.tab .ic{font-size:21px}
.card{background:var(--card);border-radius:14px;padding:15px;margin-bottom:11px;border:1px solid var(--border)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px}
.big-wrap{text-align:center;padding:16px 0 6px}
.big-time{font-size:56px;font-weight:900;letter-spacing:1px;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}
.big-time .ap{font-size:22px;font-weight:700;vertical-align:middle;margin-left:6px;opacity:.9}
.big-date{font-size:13px;color:var(--muted);margin-top:8px}
.qc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px}
.qc-city{font-size:11px;color:var(--muted);margin-bottom:3px}
.qc-time{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.qc-tz{font-size:10px;color:var(--lime);font-weight:700;margin-top:2px}
.search{width:100%;padding:11px 15px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--card);color:var(--text);outline:none;margin-bottom:13px}
.search:focus{border-color:var(--lime)}
.rh{font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);padding:9px 3px 5px}
.ci{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--card);border:1px solid var(--border);border-radius:11px;margin-bottom:5px}
.ci-flag{font-size:24px;width:32px;text-align:center;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:700}
.ci-sub{font-size:10px;color:var(--muted);margin-top:1px}
.ci-right{text-align:right;flex-shrink:0}
.ci-time{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);white-space:nowrap}
.ci-date{font-size:10px;color:var(--muted);margin-top:1px}
.conv-form{display:flex;flex-direction:column;gap:11px}
select,input[type=date],input[type=time]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;font-size:14px;background:var(--card);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
select:focus,input:focus{border-color:var(--lime)}
.flabel{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conv-result{background:var(--green);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-top:10px}
.cr-label{font-size:10px;opacity:.8;letter-spacing:1.2px;text-transform:uppercase}
.cr-time{font-size:46px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1;margin:7px 0 4px}
.cr-date{font-size:13px;opacity:.88}
.cr-diff{display:inline-block;background:rgba(255,255,255,.15);border-radius:8px;padding:5px 12px;font-size:12px;margin-top:10px}
.ev{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--lime);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.ev-name{font-size:13px;font-weight:700;margin-bottom:4px}
.ev-meta{font-size:11px;color:var(--muted);line-height:1.7}
.ev-wat{color:var(--green);font-weight:700}
.no-ev-msg{font-size:13px;color:var(--muted);text-align:center;padding:16px 0}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:16px;color:var(--text)}
.cal-month{font-size:17px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd-lbl{text-align:center;font-size:9px;font-weight:800;color:var(--muted);padding:5px 0;text-transform:uppercase}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;font-size:13px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.cd.empty{cursor:default}
.cd.today{background:var(--lime);color:#fff;font-weight:800}
.cd.has-ev .dot{width:4px;height:4px;background:var(--green);border-radius:50%;position:absolute;bottom:3px}
.cd.today .dot{background:#fff}
.cd:not(.empty):not(.today):hover{background:var(--border)}
.cal-evbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-top:13px}
.cal-evtitle{font-size:13px;font-weight:700;margin-bottom:8px}
.inst-bar{background:linear-gradient(135deg,var(--green),#1b5c3a);color:#fff;border-radius:13px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.inst-bar p{font-size:12px;opacity:.92;line-height:1.4}
.inst-btn{background:#fff;color:var(--green);border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="hdr-label">🇳🇬 Nigeria · West Africa Time (UTC+1)</div>
  <div class="hdr-time" id="htime">12:00:00<span class="ap" id="hap">AM</span></div>
  <div class="hdr-date" id="hdate">Loading…</div>
</div>
<div class="content">
  <div id="p-ng" class="panel on">
    <div id="inst-bar" class="inst-bar" style="display:none">
      <p>📲 Add WAT Clock to your home screen for offline access</p>
      <button class="inst-btn" id="inst-btn">Install</button>
    </div>
    <div class="card big-wrap">
      <div class="big-time" id="big-time">12:00:00<span class="ap" id="big-ap">AM</span></div>
      <div class="big-date" id="big-date">Loading…</div>
    </div>
    <div class="card">
      <div class="card-title">Quick World Clocks</div>
      <div class="qc-grid" id="qc-grid"></div>
    </div>
  </div>
  <div id="p-world" class="panel">
    <input class="search" id="wsearch" placeholder="🔍  Search country, capital or timezone…" oninput="filterW(this.value)">
    <div id="wlist"></div>
  </div>
  <div id="p-conv" class="panel">
    <div class="card">
      <div class="card-title">Convert Any Timezone → WAT</div>
      <div class="conv-form">
        <div><label class="flabel">Timezone Abbreviation</label>
          <select id="ctz" onchange="doConv()"></select></div>
        <div class="row2">
          <div><label class="flabel">Date</label><input type="date" id="cdate" onchange="doConv()"></div>
          <div><label class="flabel">Time</label><input type="time" id="ctime" onchange="doConv()"></div>
        </div>
      </div>
      <div id="cres"></div>
    </div>
    <div class="card">
      <div class="card-title">📬 Upcoming Events</div>
      <div id="evlist"></div>
    </div>
  </div>
  <div id="p-cal" class="panel">
    <div class="card">
      <div class="cal-hdr">
        <button class="cal-nav" onclick="chMo(-1)">&#8249;</button>
        <div class="cal-month" id="cal-title"></div>
        <button class="cal-nav" onclick="chMo(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div id="cal-evbox" style="display:none" class="cal-evbox"></div>
    </div>
  </div>
</div>
<nav class="tabs">
  <button class="tab on" onclick="showTab('ng',this)"><span class="ic">🇳🇬</span>Nigeria</button>
  <button class="tab" onclick="showTab('world',this)"><span class="ic">🌍</span>World</button>
  <button class="tab" onclick="showTab('conv',this)"><span class="ic">🔄</span>Convert</button>
  <button class="tab" onclick="showTab('cal',this)"><span class="ic">📅</span>Calendar</button>
</nav>
</div>

// ==================== HELPERS ====================
function localParts(date, tz) {
  return Object.fromEntries(
    new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})
    .formatToParts(date).map(({type,value})=>[type,value])
  );
}

function to12(h24, mn, sc) {
  const h = parseInt(h24), ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
  return {
    hms: String(h12).padStart(2,'0') + ':' + mn + ':' + sc,
    hm:  String(h12).padStart(2,'0') + ':' + mn,
    ap
  };
}

function getTime(tz) {
  const now = new Date();
  const p = localParts(now, tz);
  const t = to12(p.hour, p.minute, p.second);
  return {
    hms: t.hms, hm: t.hm, ap: t.ap,
    full: new Intl.DateTimeFormat('en-NG',{timeZone:tz,weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(now),
    short: new Intl.DateTimeFormat('en-NG',{timeZone:tz,month:'short',day:'numeric'}).format(now),
  };
}

function offsetStr(tz) {
  const now = new Date();
  const p = localParts(now, tz);
  const lh = parseInt(p.hour), lm = parseInt(p.minute);
  const uh = now.getUTCHours(), um = now.getUTCMinutes();
  let d = (lh*60+lm)-(uh*60+um);
  if(d>720)d-=1440; if(d<-720)d+=1440;
  const s = d>=0?'+':'-', a=Math.abs(d), wh=Math.floor(a/60), wm=a%60;
  return 'UTC'+s+wh+(wm?':'+String(wm).padStart(2,'0'):'');
}

function fmtH(h) {
  const a = Math.abs(h);
  if(a === Math.floor(a)) return a+'h';
  const wh = Math.floor(a), wm = Math.round((a-wh)*60);
  return wh > 0 ? wh+'h '+wm+'m' : wm+'m';
}

  document.getElementById('big-date').textContent = t.full;

  QC.forEach(c => {
    const el = document.getElementById('qci-'+c.city.replace(/\s/g,'_'));
    if(el) {
      const qt = getTime(c.tz);
      el.querySelector('.qc-time').textContent = qt.hm + ' ' + qt.ap;
    }
  });

  COUNTRIES.forEach((_,i) => {
    const el = document.getElementById('ci-'+i);
    if(el) {
      const ct = getTime(COUNTRIES[i].tz);
      el.querySelector('.ci-time').textContent = ct.hm + ' ' + ct.ap;
      el.querySelector('.ci-date').textContent = ct.short;
    }
  });
}

// ==================== WORLD CLOCK ====================
function buildWorld(filter) {
  const q = (filter||'').toLowerCase().trim();
  const regions = ['Africa','Americas','Asia','Europe','Oceania'];
  let html = '';
  regions.forEach(r => {
    let list = COUNTRIES
      .filter((c,_) => c.r===r && (!q || c.n.toLowerCase().includes(q) || c.cap.toLowerCase().includes(q) || c.ab.toLowerCase().includes(q) || c.tz.toLowerCase().includes(q)))
      .sort((a,b) => a.n.localeCompare(b.n));
    if(!list.length) return;
    html += '<div class="rh">'+r+'</div>';
    list.forEach(c => {
      const i = COUNTRIES.indexOf(c);
      const ct = getTime(c.tz);
      const off = offsetStr(c.tz);
      html += '<div class="ci" id="ci-'+i+'">' +
        '<div class="ci-flag">'+c.f+'</div>' +
        '<div class="ci-info"><div class="ci-name">'+c.n+'</div>' +
        '<div class="ci-sub">🏛 '+c.cap+' &nbsp;·&nbsp; '+c.ab+' &nbsp;·&nbsp; '+off+'</div></div>' +
        '<div class="ci-right"><div class="ci-time">'+ct.hm+' '+ct.ap+'</div><div class="ci-date">'+ct.short+'</div></div>' +
        '</div>';
    });
  });
  document.getElementById('wlist').innerHTML = html || '<p style="color:var(--muted);padding:20px;text-align:center">No matches found</p>';
}

function filterW(v) { buildWorld(v); }

// ==================== CONVERT ====================
function buildConvDropdown() {
  document.getElementById('ctz').innerHTML = TZ_ABBRS.map((t,i) => {
    const s = t.off>=0?'+':'-', a=Math.abs(t.off), wh=Math.floor(a), wm=Math.round((a-wh)*60);
    const offLabel = 'UTC'+s+wh+(wm?':'+String(wm).padStart(2,'0'):'');
    return '<option value="'+i+'">'+t.ab+' — '+t.label+' ('+offLabel+')</option>';
  }).join('');
  // Default to CET (common for her events)
  const cetIdx = TZ_ABBRS.findIndex(t=>t.ab==='CET');
  if(cetIdx>=0) document.getElementById('ctz').value = cetIdx;
}

function doConv() {
  const idx = parseInt(document.getElementById('ctz').value);
  const tz = TZ_ABBRS[idx];
  const dateVal = document.getElementById('cdate').value;
  const timeVal = document.getElementById('ctime').value;
  if(!dateVal||!timeVal) { document.getElementById('cres').innerHTML=''; return; }
  try {
    const [yr,mo,dy] = dateVal.split('-').map(Number);
    const [hr,mn] = timeVal.split(':').map(Number);
    // UTC = local_time - offset
    const utcMs = Date.UTC(yr, mo-1, dy, hr, mn) - tz.off * 3600000;
    const utcDate = new Date(utcMs);
    const wp = localParts(utcDate, 'Africa/Lagos');
    const wt = to12(wp.hour, wp.minute, wp.second);
    const wDate = new Intl.DateTimeFormat('en-NG',{timeZone:'Africa/Lagos',weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(utcDate);
    const dh = 1 - tz.off;
    let dLabel = Math.abs(dh)<0.01 ? 'Same timezone as WAT' :
      dh>0 ? 'WAT is '+fmtH(Math.abs(dh))+' ahead of '+tz.ab :
              'WAT is '+fmtH(Math.abs(dh))+' behind '+tz.ab;
    document.getElementById('cres').innerHTML =
      '<div class="conv-result">' +
      '<div class="cr-label">🇳🇬 Nigeria · West Africa Time (UTC+1)</div>' +
      '<div class="cr-time">'+wt.hm+' <span style="font-size:22px;font-weight:700;opacity:.9">'+wt.ap+'</span></div>' +
      '<div class="cr-date">'+wDate+'</div>' +
      '<div class="cr-diff">'+dLabel+'</div>' +
      '</div>';
  } catch(e) {
    document.getElementById('cres').innerHTML = '<p style="color:red;padding:8px;font-size:13px">Conversion error — check your inputs.</p>';
  }
}

function buildEvents() {
  const today = new Date().toISOString().split('T')[0];
  const upcoming = ALL_EVENTS.filter(e => e.date >= today);
  if(!upcoming.length) {
    document.getElementById('evlist').innerHTML = '<div class="no-ev-msg">No upcoming events at the moment.</div>';
    return;
  }
  document.getElementById('evlist').innerHTML = upcoming.map(e =>
    '<div class="ev">' +
    '<div class="ev-name">'+e.name+'</div>' +
    '<div class="ev-meta">📅 '+e.date+' &nbsp;·&nbsp; '+e.orig+' &rarr; <span class="ev-wat">'+e.wat+'</span></div>' +
    '<div class="ev-meta">🏢 '+e.org+'</div>' +
    '</div>'
  ).join('');
}

// ==================== CALENDAR ====================
const MNS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function buildCal(y, m) {
  calY=y; calM=m;
  document.getElementById('cal-title').textContent = MNS[m]+' '+y;
  const fd = new Date(y,m,1).getDay(), dim = new Date(y,m+1,0).getDate();
  const now = new Date();
  const evDates = new Set(ALL_EVENTS.map(e=>e.date));
  let h='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{h+='<div class="cd-lbl">'+d+'</div>';});
  for(let i=0;i<fd;i++) h+='<div class="cd empty"></div>';
  for(let d=1;d<=dim;d++) {
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isT=y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate();
    const hasE=evDates.has(ds);
    h+='<div class="cd'+(isT?' today':'')+(hasE?' has-ev':'')+'" onclick="calDay(\'' +ds+ '\')">'+d+(hasE?'<span class="dot"></span>':'')+'</div>';
  }
  document.getElementById('cal-grid').innerHTML = h;
  document.getElementById('cal-evbox').style.display = 'none';
}

function chMo(d) {
  let m=calM+d, y=calY;
  if(m>11){m=0;y++;} if(m<0){m=11;y--;}
  buildCal(y,m);
}

function calDay(ds) {
  const evs = ALL_EVENTS.filter(e=>e.date===ds);
  const [yr,mo,dy] = ds.split('-');
  const lbl = new Date(Number(yr),Number(mo)-1,Number(dy)).toLocaleDateString('en-NG',{weekday:'long',month:'long',day:'numeric'});
  const box = document.getElementById('cal-evbox');
  box.style.display = 'block';
  box.innerHTML = '<div class="cal-evtitle">'+lbl+'</div>' + (evs.length ?
    evs.map(e=>'<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:700">'+e.name+'</div><div style="font-size:11px;color:var(--muted);margin-top:2px">'+e.orig+' &rarr; <span style="color:var(--green);font-weight:700">'+e.wat+'</span></div><div style="font-size:10px;color:var(--muted)">'+e.org+'</div></div>').join('') :
    '<div style="font-size:12px;color:var(--muted)">No events this day.</div>');
}

// ==================== QUICK CLOCKS ====================
function buildQC() {
  document.getElementById('qc-grid').innerHTML = QC.map(c => {
    const t = getTime(c.tz);
    return '<div class="qc" id="qci-'+c.city.replace(/\s/g,'_')+'">'+
      '<div class="qc-city">'+c.city+'</div>'+
      '<div class="qc-time">'+t.hm+' '+t.ap+'</div>'+
      '<div class="qc-tz">'+c.ab+'</div></div>';
  }).join('');
}

// ==================== PWA ====================
function setupPWA() {
  const mf = {name:'WAT Clock',short_name:'WAT Clock',description:'Nigeria timezone clock & world time converter',start_url:'./',display:'standalone',background_color:'#2D6A4F',theme_color:'#2D6A4F',
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232D6A4F' rx='18'/%3E%3Ctext y='80' x='5' font-size='85'%3E%F0%9F%87%B3%F0%9F%87%AC%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml'}]};
  const ml = document.createElement('link'); ml.rel='manifest';
  ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
  document.head.appendChild(ml);
  if('serviceWorker' in navigator) {
    const sw = `const C='wat-v3';
self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./']).catch(()=>{})).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok){const rc=res.clone();caches.open(C).then(c=>c.put(e.request,rc));}return res;})));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
  }
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferredPWA=e;
    document.getElementById('inst-bar').style.display='flex';
  });
  document.getElementById('inst-btn').addEventListener('click',()=>{
    if(deferredPWA){deferredPWA.prompt();deferredPWA.userChoice.then(()=>{deferredPWA=null;document.getElementById('inst-bar').style.display='none';});}
  });
}

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded',()=>{
  const now = new Date();
  calY = now.getFullYear(); calM = now.getMonth();
  document.getElementById('cdate').value = now.toISOString().split('T')[0];
  document.getElementById('ctime').value = '14:00';
  buildConvDropdown();
  buildQC();
  buildWorld('');
  buildEvents();
  buildCal(calY, calM);
  tick();
  setInterval(tick, 1000);
  setupPWA();
});
</script>
